<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบสมาชิก</title>
<style>
body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
form { display: grid; gap: 0.5rem; margin-bottom: 1.5rem; }
table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
th, td { border: 1px solid #ccc; padding: 0.4rem; text-align: left; }
.success { color: green; }
.error { color: red; }
.search-box { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.search-box input { flex: 1; padding: 0.4rem; }
</style>
</head>
<body>
<h1>ระบบสมาชิก</h1>
<p id="message"></p>

<h2>สมัครสมาชิก</h2>
<form id="register-form">
<input name="username" placeholder="username (a-z, 0-9, _)" required>
<input name="name" placeholder="ชื่อ-นามสกุล" required>
<input name="email" type="email" placeholder="อีเมล" required>
<input name="password" type="password" placeholder="รหัสผ่าน (อย่างน้อย 8 ตัว)" minlength="8" required>
<button type="submit">สมัครสมาชิก</button>
</form>

<h2>เข้าสู่ระบบ</h2>
<form id="login-form">
<input name="username" placeholder="username" required>
<input name="password" type="password" placeholder="รหัสผ่าน" required>
<button type="submit">เข้าสู่ระบบ</button>
</form>

<h2>เปลี่ยนรหัสผ่าน</h2>
<form id="change-password-form">
<input name="username" placeholder="username" required>
<input name="oldPassword" type="password" placeholder="รหัสผ่านเดิม" required>
<input name="newPassword" type="password" placeholder="รหัสผ่านใหม่ (อย่างน้อย 8 ตัว)" minlength="8" required>
<button type="submit">เปลี่ยนรหัสผ่าน</button>
</form>

<h2>สมาชิกทั้งหมด</h2>
<!-- ช่องค้นหาสมาชิกตามชื่อ -->
<div class="search-box">
  <input type="text" id="search-input" placeholder="พิมพ์ชื่อเพื่อค้นหาสมาชิก...">
  <button id="search-btn">ค้นหา</button>
</div>

<table>
<thead>
<tr><th>username</th><th>ชื่อ</th><th>อีเมล</th><th>role</th><th>จัดการ</th></tr>
</thead>
<tbody id="user-table"></tbody>
</table>

<script src="script.js"></script>
</body>
</html>
